name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paulux
          POSTGRES_PASSWORD: paulux
          POSTGRES_DB: paulux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paulux"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Run tests (incl. tenant isolation + payments)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://paulux:paulux@localhost:5432/paulux_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Backend only. The SPA is deployed by Vercel's own Git integration, which
  # builds on push to main independently of this workflow.
  deploy-backend:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo redeploy
        # Komodo pulls the repo and rebuilds the stack itself; CI just signals
        # it once both gates are green. Set KOMODO_WEBHOOK_URL to the stack's
        # listener URL and KOMODO_WEBHOOK_SECRET to its configured secret.
        env:
          URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
          SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          if [ -z "$URL" ]; then
            echo "KOMODO_WEBHOOK_URL is not set — nothing to trigger." >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST "$URL" \
            -H "Content-Type: application/json" \
            ${SECRET:+-H "Authorization: Bearer $SECRET"} \
            -d '{"ref":"refs/heads/main"}'
