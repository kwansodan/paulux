<!doctype html>
<html>
  <body style="margin:0;background:#faf6f3;font-family:Helvetica,Arial,sans-serif;color:#1b1220;">
    <div style="max-width:560px;margin:0 auto;padding:32px 16px;">
      <div style="text-align:center;padding:8px 0 24px;">
        <span style="font-family:Georgia,serif;font-size:22px;font-weight:600;color:#31184b;letter-spacing:-0.01em;">
          {{ org_name or "Paulux" }}
        </span>
      </div>
      <div style="background:#fffdfb;border:1px solid #e5d9d4;border-radius:18px;padding:32px;">
        {% block content %}{% endblock %}
      </div>
      <p style="text-align:center;color:#9a8d99;font-size:12px;margin-top:24px;">
        Relaxation, care, and luxury wellness.
      </p>
    </div>
  </body>
</html>
