{% extends "base.html" %}
{% block content %}
<h1 style="font-family:Georgia,serif;font-size:24px;font-weight:500;margin:0 0 8px;">Reset your password</h1>
<p style="color:#6f6270;margin:0 0 20px;">
  We received a request to reset your password. This link expires in 30 minutes.
  If you didn't request it, you can safely ignore this email.
</p>
<a href="{{ reset_link }}"
   style="display:inline-block;background:#31184b;color:#f6efe9;text-decoration:none;padding:12px 24px;border-radius:999px;font-weight:600;">
  Reset password
</a>
<p style="color:#9a8d99;font-size:12px;margin-top:20px;word-break:break-all;">
  Or paste this link into your browser:<br>{{ reset_link }}
</p>
{% endblock %}
